<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - Livraison Abidjan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        
        <!-- Titre dynamique -->
        <h2 id="form-title" class="text-2xl font-bold text-center text-gray-800 mb-6">Connexion à votre compte</h2>

        <!-- Onglets -->
        <div class="flex border-b mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="w-1/2 pb-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600">Connexion</button>
            <button id="tab-register" onclick="switchTab('register')" class="w-1/2 pb-2 text-center font-semibold text-gray-400">Inscription</button>
        </div>

        <!-- FORMULAIRE -->
        <form id="auth-form" onsubmit="handleSubmit(event)">
            
            <!-- Nom (Uniquement pour l'inscription) -->
            <div id="field-nom" class="mb-4 hidden">
                <label class="block text-gray-700 text-sm font-bold mb-2">Nom complet</label>
                <input type="text" id="nom" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Koffi Jean">
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="exemple@domaine.com">
            </div>

            <!-- Mot de passe -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Mot de passe</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
            </div>

            <!-- Téléphone (Uniquement pour l'inscription) -->
            <div id="field-telephone" class="mb-4 hidden">
                <label class="block text-gray-700 text-sm font-bold mb-2">Téléphone</label>
                <input type="text" id="telephone" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="+225 0700000000">
            </div>

            <!-- Rôle (Uniquement pour l'inscription) -->
            <div id="field-role" class="mb-4 hidden">
                <label class="block text-gray-700 text-sm font-bold mb-2">Je suis un :</label>
                <select id="role" onchange="toggleLivreurFields()" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="client">Client</option>
                    <option value="livreur">Livreur</option>
                </select>
            </div>

            <!-- CHAMPS SUPPLÉMENTAIRES LIVREUR -->
            <div id="livreur-extra-fields" class="mb-4 hidden bg-blue-50 p-4 rounded-lg border border-blue-200">
                <p class="text-xs font-bold text-blue-700 uppercase mb-2">Informations spécifiques Livreur</p>
                
                <!-- Type de véhicule -->
                <div class="mb-3">
                    <label class="block text-gray-700 text-xs font-bold mb-1">Type de véhicule</label>
                    <select id="vehicule" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                        <option value="moto">Moto</option>
                        <option value="velo">Vélo</option>
                        <option value="voiture">Voiture</option>
                    </select>
                </div>

                <!-- Commune d'intervention -->
                <div class="mb-3">
                    <label class="block text-gray-700 text-xs font-bold mb-1">Commune d'intervention</label>
                    <select id="commune_id" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                        <option value="">-- Sélectionnez une commune --</option>
                        <option value="1">Abobo</option>
                        <option value="2">Adjamé</option>
                        <option value="3">Anyama</option>
                        <option value="4">Attécoubé</option>
                        <option value="5">Bingerville</option>
                        <option value="6">Cocody</option>
                        <option value="7">Koumassi</option>
                        <option value="8">Marcory</option>
                        <option value="9">Plateau</option>
                        <option value="10">Port-Bouët</option>
                        <option value="11">Songon</option>
                        <option value="12">Treichville</option>
                        <option value="13">Yopougon</option>
                    </select>
                </div>

                <!-- Capacité en kg -->
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">Capacité maximale (kg)</label>
                    <input type="number" id="capacite_kg" value="50.0" step="10" class="w-full px-3 py-2 border rounded-lg text-sm bg-white" placeholder="50">
                </div>
            </div>

            <!-- Message -->
            <div id="message" class="mb-4 text-sm text-center font-medium"></div>

            <!-- Bouton -->
            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                Se connecter
            </button>
        </form>
    </div>

    <script>
        let isLoginMode = true;

        function switchTab(mode) {
            isLoginMode = (mode === 'login');
            const formTitle = document.getElementById('form-title');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const submitBtn = document.getElementById('submit-btn');

            const fieldNom = document.getElementById('field-nom');
            const fieldTel = document.getElementById('field-telephone');
            const fieldRole = document.getElementById('field-role');

            if (isLoginMode) {
                formTitle.innerText = "Connexion à votre compte";
                tabLogin.className = "w-1/2 pb-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600";
                tabRegister.className = "w-1/2 pb-2 text-center font-semibold text-gray-400";
                submitBtn.innerText = "Se connecter";

                fieldNom.classList.add('hidden');
                fieldTel.classList.add('hidden');
                fieldRole.classList.add('hidden');
                document.getElementById('livreur-extra-fields').classList.add('hidden');
            } else {
                formTitle.innerText = "Créer un compte";
                tabRegister.className = "w-1/2 pb-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600";
                tabLogin.className = "w-1/2 pb-2 text-center font-semibold text-gray-400";
                submitBtn.innerText = "S'inscrire";

                fieldNom.classList.remove('hidden');
                fieldTel.classList.remove('hidden');
                fieldRole.classList.remove('hidden');
                
                toggleLivreurFields();
            }
            document.getElementById('message').innerText = "";
        }

        function toggleLivreurFields() {
            const roleSelect = document.getElementById('role').value;
            const livreurFields = document.getElementById('livreur-extra-fields');

            if (!isLoginMode && roleSelect === 'livreur') {
                livreurFields.classList.remove('hidden');
            } else {
                livreurFields.classList.add('hidden');
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = "";

            if (isLoginMode) {
                // --- CONNEXION ---
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                try {
                    const response = await fetch('http://localhost:8000/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    const data = await response.json();
                    
                    if (response.ok) {
                        msgDiv.className = "mb-4 text-sm text-center font-medium text-green-600";
                        msgDiv.innerText = "Connexion réussie ! Redirection...";
                        
                        localStorage.setItem('token', data.access_token);
                        if (data.utilisateur_id) {
                            localStorage.setItem('utilisateur_id', data.utilisateur_id);
                        }
                        if (data.nom) {
                            localStorage.setItem('nom', data.nom);
                        }

                        const role = data.role;
                        setTimeout(() => {
                            if (role === 'admin') {
                                window.location.href = '/admin/dashboard';
                            } else if (role === 'livreur') {
                                window.location.href = '/livreur/dashboard';
                            } else {
                                window.location.href = '/client/dashboard';
                            }
                        }, 1000);

                    } else {
                        msgDiv.className = "mb-4 text-sm text-center font-medium text-red-600";
                        msgDiv.innerText = data.detail || "Erreur de connexion";
                    }
                } catch (err) {
                    msgDiv.className = "mb-4 text-sm text-center font-medium text-red-600";
                    msgDiv.innerText = "Impossible de joindre le serveur.";
                }
            } else {
                // --- INSCRIPTION ---
                const payload = {
                    nom: document.getElementById('nom').value.trim(),
                    email: email,
                    password: password,
                    telephone: document.getElementById('telephone').value.trim(),
                    role: document.getElementById('role').value
                };

                // Validation simple
                if (!payload.nom || !payload.telephone) {
                    msgDiv.className = "mb-4 text-sm text-center font-medium text-red-600";
                    msgDiv.innerText = "Veuillez remplir le nom et le téléphone.";
                    return;
                }

                // Champs spécifiques livreur
                if (payload.role === 'livreur') {
                    payload.vehicule = document.getElementById('vehicule').value;
                    payload.capacite_kg = parseFloat(document.getElementById('capacite_kg').value) || 50.0;
                    payload.commune_id = parseInt(document.getElementById('commune_id').value) || null;

                    if (!payload.commune_id) {
                        msgDiv.className = "mb-4 text-sm text-center font-medium text-red-600";
                        msgDiv.innerText = "Veuillez choisir votre commune.";
                        return;
                    }
                }

                try {
                    const response = await fetch('http://localhost:8000/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();

                    if (response.ok) {
                        msgDiv.className = "mb-4 text-sm text-center font-medium text-green-600";
                        msgDiv.innerText = "Compte créé avec succès ! Connectez-vous.";
                        setTimeout(() => switchTab('login'), 1500);
                    } else {
                        msgDiv.className = "mb-4 text-sm text-center font-medium text-red-600";
                        msgDiv.innerText = data.detail || "Erreur lors de l'inscription";
                    }
                } catch (err) {
                    msgDiv.className = "mb-4 text-sm text-center font-medium text-red-600";
                    msgDiv.innerText = "Impossible de joindre le serveur.";
                }
            }
        }
    </script>
</body>
</html>
