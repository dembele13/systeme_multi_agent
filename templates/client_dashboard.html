<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Client - Livraison Abidjan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">📦 Espace Client - Abidjan</h1>
            <button onclick="deconnexion()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition">Déconnexion</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- Nouvelle commande -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4">🚀 Passer une commande</h2>

            <form id="commande-form" onsubmit="creerCommande(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="commune_depart">Commune de départ</label>
                    <select id="commune_depart" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">-- Chargement des communes... --</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="commune_arrivee">Commune d'arrivée</label>
                    <select id="commune_arrivee" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">-- Chargement des communes... --</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="poids_kg">Poids estimé (kg)</label>
                    <input type="number" id="poids_kg" value="2" step="0.1" min="0.1" max="1000" required
                           class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div id="cmd-message" class="mb-4 text-sm text-center font-medium"></div>

                <button id="btn-commande" type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold py-2 px-4 rounded-lg transition">
                    Valider la commande
                </button>
                <p class="text-xs text-gray-400 text-center mt-2">Le prix est calculé automatiquement selon la distance et le poids.</p>
            </form>
        </div>

        <!-- Historique -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4">📋 Mes commandes récentes</h2>

            <div id="historique-list" class="space-y-3 overflow-y-auto max-h-96">
                <p class="text-gray-500 text-sm text-center py-4">Chargement de l'historique...</p>
            </div>

            <button onclick="chargerHistorique()" class="mt-4 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition text-sm">
                Rafraîchir l'historique
            </button>
        </div>
    </main>

    <!-- Modal d'évaluation -->
    <div id="eval-modal" class="hidden fixed inset-0 bg-black/50 items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-1">⭐ Évaluer la livraison</h3>
            <p id="eval-titre" class="text-sm text-gray-500 mb-4"></p>

            <div id="eval-stars" class="flex gap-1 mb-4"></div>

            <label class="block text-gray-700 text-sm font-bold mb-2" for="eval-commentaire">Commentaire (optionnel)</label>
            <textarea id="eval-commentaire" rows="3" maxlength="500"
                      class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3"
                      placeholder="Comment s'est passée la livraison ?"></textarea>

            <div id="eval-message" class="mb-3 text-sm text-center font-medium"></div>

            <div class="flex gap-2">
                <button onclick="fermerEvaluation()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 rounded-lg transition">Annuler</button>
                <button id="btn-eval" onclick="envoyerEvaluation()" class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold py-2 rounded-lg transition">Envoyer</button>
            </div>
        </div>
    </div>

    <script>
        // ================== CONFIGURATION ==================
        const API_URL = 'http://localhost:8000';
        const LOGIN_URL = '/login';
        // Clés possibles dans le localStorage (adapte si ton login utilise d'autres noms)
        const TOKEN_KEYS = ['token', 'access_token', 'jwt', 'authToken'];
        const USER_ID_KEYS = ['utilisateur_id', 'user_id', 'client_id'];
        // ===================================================

        // ---------- Session ----------
        function lireStockage(cles) {
            for (const k of cles) {
                const v = localStorage.getItem(k);
                if (v) return v;
            }
            return null;
        }
        const token = lireStockage(TOKEN_KEYS);

        function lireClientId() {
            const direct = lireStockage(USER_ID_KEYS);
            if (direct) return parseInt(direct);
            // Secours : id contenu dans le JWT
            if (token && token.split('.').length === 3) {
                try {
                    const p = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                    const id = p.client_id ?? p.user_id ?? p.id ?? p.sub;
                    if (id != null) return parseInt(id);
                } catch (e) { /* ignore */ }
            }
            return null;
        }
        const clientId = lireClientId();

        // Pas connecté : on redirige au lieu d'agir comme "client 1"
        if (!token || clientId == null) {
            window.location.href = LOGIN_URL;
        }

        function deconnexion() {
            [...TOKEN_KEYS, ...USER_ID_KEYS, 'utilisateur', 'user'].forEach(k => localStorage.removeItem(k));
            window.location.href = LOGIN_URL;
        }

        // ---------- Utilitaires ----------
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
            {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        const fcfa = n => new Intl.NumberFormat('fr-FR').format(n) + ' FCFA';

        function texteErreur(detail, defaut) {
            if (!detail) return defaut;
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail)) {
                return detail.map(d => d.msg || JSON.stringify(d)).join(' | ');
            }
            return defaut;
        }

        // fetch avec token ; gère le 401 (session expirée)
        async function appel(chemin, options = {}) {
            const res = await fetch(API_URL + chemin, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                    ...(options.headers || {})
                }
            });
            if (res.status === 401) { deconnexion(); throw new Error('Session expirée'); }
            let corps = null;
            try { corps = await res.json(); } catch (e) { /* corps vide */ }
            return { ok: res.ok, status: res.status, corps };
        }

        // ---------- Communes ----------
        let communes = {};   // id -> nom

        async function chargerCommunes() {
            try {
                const { ok, corps } = await appel('/communes');
                if (!ok) throw new Error();
                // La route renvoie une liste directe ; on tolère aussi {data: [...]}
                const liste = Array.isArray(corps) ? corps : (corps && corps.data) || [];
                communes = Object.fromEntries(liste.map(c => [c.id, c.nom ?? c.name ?? ('Commune ' + c.id)]));

                const options = liste.map(c => `<option value="${esc(c.id)}">${esc(communes[c.id])}</option>`).join('');
                document.getElementById('commune_depart').innerHTML =
                    '<option value="">-- Choisir la commune de départ --</option>' + options;
                document.getElementById('commune_arrivee').innerHTML =
                    '<option value="">-- Choisir la commune d\'arrivée --</option>' + options;
            } catch (err) {
                document.getElementById('commune_depart').innerHTML = '<option value="">Communes indisponibles</option>';
                document.getElementById('commune_arrivee').innerHTML = '<option value="">Communes indisponibles</option>';
            }
        }
        const nomCommune = id => communes[id] || ('#' + id);

        // ---------- Création de commande ----------
        async function creerCommande(event) {
            event.preventDefault();
            const msgDiv = document.getElementById('cmd-message');
            const btn = document.getElementById('btn-commande');
            msgDiv.innerText = '';

            // client_id volontairement absent : il est déduit du token par le serveur
            const payload = {
                commune_depart_id: parseInt(document.getElementById('commune_depart').value),
                commune_arrivee_id: parseInt(document.getElementById('commune_arrivee').value),
                poids_kg: parseFloat(document.getElementById('poids_kg').value)
            };

            btn.disabled = true;
            try {
                const { ok, corps } = await appel('/commandes/', { method: 'POST', body: JSON.stringify(payload) });
                if (ok) {
                    msgDiv.className = 'mb-4 text-sm text-center font-medium text-green-600';
                    msgDiv.innerText = `Commande créée avec succès ! Prix : ${fcfa(corps.data.prix)}`;
                    document.getElementById('commande-form').reset();
                    chargerHistorique();
                } else {
                    msgDiv.className = 'mb-4 text-sm text-center font-medium text-red-600';
                    msgDiv.innerText = texteErreur(corps && corps.detail, 'Erreur lors de la création');
                }
            } catch (err) {
                if (err.message !== 'Session expirée') {
                    msgDiv.className = 'mb-4 text-sm text-center font-medium text-red-600';
                    msgDiv.innerText = 'Impossible de joindre le serveur.';
                }
            }
            btn.disabled = false;
        }

        // ---------- Historique ----------
        const STATUTS = {
            creee:     'bg-orange-100 text-orange-700',
            attribuee: 'bg-blue-100 text-blue-700',
            livree:    'bg-green-100 text-green-700',
            annulee:   'bg-gray-200 text-gray-600',
            echec:     'bg-red-100 text-red-700'
        };
        let commandesChargees = {};   // id -> commande

        async function chargerHistorique() {
            const listDiv = document.getElementById('historique-list');
            try {
                const { ok, corps } = await appel(`/clients/${clientId}/commandes`);
                if (!ok) throw new Error();
                const liste = (corps && corps.data) || [];
                commandesChargees = Object.fromEntries(liste.map(c => [c.id, c]));

                if (!liste.length) {
                    listDiv.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Aucune commande pour le moment.</p>';
                    return;
                }

                listDiv.innerHTML = liste.map(cmd => {
                    const peutEvaluer = cmd.statut === 'livree' && cmd.livreur_id != null;
                    const date = cmd.cree_le ? new Date(cmd.cree_le).toLocaleString('fr-FR', {dateStyle: 'short', timeStyle: 'short'}) : '';
                    return `
                    <div class="border p-3 rounded-lg bg-gray-50 text-sm">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <p class="font-bold text-blue-600">Commande #${esc(cmd.id)}</p>
                                <p class="text-gray-700">${esc(nomCommune(cmd.commune_depart_id))} → ${esc(nomCommune(cmd.commune_arrivee_id))}</p>
                                <p class="text-gray-500 text-xs mt-1">${esc(cmd.poids_kg)} kg · ${esc(date)}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <p class="font-bold text-gray-800">${esc(fcfa(cmd.prix))}</p>
                                <span class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs font-semibold uppercase ${STATUTS[cmd.statut] || 'bg-gray-100 text-gray-600'}">${esc(cmd.statut)}</span>
                            </div>
                        </div>
                        ${peutEvaluer ? `<button onclick="ouvrirEvaluation(${Number(cmd.id)})" class="mt-2 text-xs font-semibold text-blue-600 hover:underline">⭐ Évaluer la livraison</button>` : ''}
                    </div>`;
                }).join('');
            } catch (err) {
                if (err.message !== 'Session expirée') {
                    listDiv.innerHTML = '<p class="text-red-500 text-sm text-center py-4">Erreur de chargement.</p>';
                }
            }
        }

        // ---------- Évaluation ----------
        let evalCommande = null;
        let evalNote = 0;

        function dessinerEtoiles() {
            const box = document.getElementById('eval-stars');
            box.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = '★';
                b.className = 'text-3xl leading-none ' + (i <= evalNote ? 'text-yellow-400' : 'text-gray-300');
                b.onclick = () => { evalNote = i; dessinerEtoiles(); };
                box.appendChild(b);
            }
        }

        function ouvrirEvaluation(commandeId) {
            evalCommande = commandesChargees[commandeId];
            if (!evalCommande) return;
            evalNote = 0;
            document.getElementById('eval-titre').innerText = `Commande #${evalCommande.id}`;
            document.getElementById('eval-commentaire').value = '';
            document.getElementById('eval-message').innerText = '';
            dessinerEtoiles();
            const modal = document.getElementById('eval-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function fermerEvaluation() {
            const modal = document.getElementById('eval-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function envoyerEvaluation() {
            const msg = document.getElementById('eval-message');
            const btn = document.getElementById('btn-eval');
            if (!evalNote) {
                msg.className = 'mb-3 text-sm text-center font-medium text-red-600';
                msg.innerText = 'Choisis une note de 1 à 5.';
                return;
            }
            btn.disabled = true;
            try {
                const { ok, corps } = await appel('/clients/evaluations', {
                    method: 'POST',
                    body: JSON.stringify({
                        commande_id: evalCommande.id,
                        livreur_id: evalCommande.livreur_id,
                        note: evalNote,
                        commentaire: document.getElementById('eval-commentaire').value.trim() || null
                    })
                });
                if (ok) {
                    msg.className = 'mb-3 text-sm text-center font-medium text-green-600';
                    msg.innerText = 'Merci pour votre évaluation !';
                    setTimeout(fermerEvaluation, 1200);
                } else {
                    msg.className = 'mb-3 text-sm text-center font-medium text-red-600';
                    msg.innerText = texteErreur(corps && corps.detail, "Erreur lors de l'envoi");
                }
            } catch (err) {
                if (err.message !== 'Session expirée') {
                    msg.className = 'mb-3 text-sm text-center font-medium text-red-600';
                    msg.innerText = 'Impossible de joindre le serveur.';
                }
            }
            btn.disabled = false;
        }

        // ---------- Démarrage ----------
        window.onload = async () => {
            if (!token || clientId == null) return;
            await chargerCommunes();     // d'abord les noms, pour l'historique
            chargerHistorique();
        };
    </script>
</body>
</html>
